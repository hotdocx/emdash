name: Deploy reviewer to GitHub Pages

on:
  workflow_run:
    workflows: [Validate repository]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful main validation run containing the reviewer artifact
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  select:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.artifact.outputs.deploy }}
      artifact: ${{ steps.artifact.outputs.artifact }}
      sha: ${{ steps.artifact.outputs.sha }}
      run: ${{ steps.artifact.outputs.run }}
      attempt: ${{ steps.artifact.outputs.attempt }}
    steps:
      - name: Read trusted main publication policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact successful validation artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.validation_run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/validation-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/validation-artifacts.json"
          args=(select --run "$RUNNER_TEMP/validation-run.json" --artifacts "$RUNNER_TEMP/validation-artifacts.json" --repository "$GITHUB_REPOSITORY" --current-main)
          if [ "$EVENT" = workflow_dispatch ]; then args+=(--manual); fi
          python3 .github/scripts/validation_artifacts.py "${args[@]}"

  prepare:
    needs: select
    if: needs.select.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - name: Read trusted main verification policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - name: Download the bundle that passed validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.select.outputs.artifact }}
          run-id: ${{ needs.select.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-reviewer
      - name: Verify source identity and every deployed file
        env:
          SOURCE_SHA: ${{ needs.select.outputs.sha }}
          VALIDATION_RUN: ${{ needs.select.outputs.run }}
          VALIDATION_ATTEMPT: ${{ needs.select.outputs.attempt }}
        run: python3 .github/scripts/validation_artifacts.py verify --directory verified-reviewer --sha "$SOURCE_SHA" --run "$VALIDATION_RUN" --attempt "$VALIDATION_ATTEMPT"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: verified-reviewer

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
